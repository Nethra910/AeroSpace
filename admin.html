<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — MANI Aerospace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="container" style="padding-top:40px;">
    <p id="checkingMsg" class="loading-line">Checking session…</p>

    <div class="admin-shell" id="adminShell">
      <div class="admin-topbar">
        <div>
          <div class="eyebrow" style="margin-bottom:6px;">Admin</div>
          <h1 style="font-size:26px;">Content dashboard</h1>
        </div>
        <div style="display:flex; align-items:center; gap:16px;">
          <span class="loading-line" id="whoami"></span>
          <button class="btn btn-ghost" id="logoutBtn">Log out</button>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="news">News</button>
        <button class="admin-tab" data-tab="home">Home Page</button>
        <button class="admin-tab" data-tab="mission">Mission Page</button>
      </div>

      <!-- NEWS -->
      <section class="admin-panel active" id="panel-news">
        <div class="editor-card">
          <h3 id="newsFormTitle">New article</h3>
          <input type="hidden" id="newsId">
          <div class="field">
            <label for="newsTitle">Title</label>
            <input type="text" id="newsTitle" placeholder="e.g. MANI Aerospace begins first propulsion test series">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="newsCategory">Category</label>
              <select id="newsCategory">
                <option>Announcement</option>
                <option>Milestone</option>
                <option>Research</option>
                <option>Press Release</option>
                <option>Company Update</option>
              </select>
            </div>
            <div class="field">
              <label for="newsAuthor">Author</label>
              <input type="text" id="newsAuthor" value="MANI Aerospace">
            </div>
          </div>
          <div class="field">
            <label for="newsSummary">Summary (shown on cards, max ~300 characters)</label>
            <textarea id="newsSummary" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="newsBody">Full article</label>
            <textarea id="newsBody" rows="8"></textarea>
          </div>
          <div class="field pill-toggle">
            <input type="checkbox" id="newsPublished">
            <label for="newsPublished" style="margin:0;">Published (visible on the site)</label>
          </div>
          <div style="display:flex; gap:12px; margin-top:8px;">
            <button class="btn btn-primary" id="newsSaveBtn">Save article</button>
            <button class="btn btn-ghost" id="newsResetBtn" type="button">Clear form</button>
          </div>
          <div class="form-msg" id="newsFormMsg"></div>
        </div>

        <h3 style="margin-bottom:16px; font-size:15px;">All articles</h3>
        <div class="admin-list" id="newsList"><div class="admin-list-row"><span class="loading-line">Loading…</span></div></div>
      </section>

      <!-- HOME -->
      <section class="admin-panel" id="panel-home">
        <div class="editor-card">
          <h3>Hero</h3>
          <div class="field">
            <label for="homeEyebrow">Eyebrow label</label>
            <input type="text" id="homeEyebrow">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="homeHeadlinePre">Headline (plain part)</label>
              <input type="text" id="homeHeadlinePre">
            </div>
            <div class="field">
              <label for="homeHeadlineHighlight">Headline (highlighted part)</label>
              <input type="text" id="homeHeadlineHighlight">
            </div>
          </div>
          <div class="field">
            <label for="homeLead">Lead paragraph</label>
            <textarea id="homeLead" rows="3"></textarea>
          </div>
        </div>

        <div class="editor-card">
          <h3>Focus area cards</h3>
          <div id="homeCardsEditor"></div>
        </div>

        <button class="btn btn-primary" id="homeSaveBtn">Save home page</button>
        <div class="form-msg" id="homeFormMsg"></div>
      </section>

      <!-- MISSION -->
      <section class="admin-panel" id="panel-mission">
        <div class="editor-card">
          <h3>Intro & statement</h3>
          <div class="field">
            <label for="missionIntroInput">Intro paragraph</label>
            <textarea id="missionIntroInput" rows="3"></textarea>
          </div>
          <div class="field">
            <label for="missionStatementInput">Mission statement</label>
            <textarea id="missionStatementInput" rows="3"></textarea>
          </div>
        </div>

        <div class="editor-card">
          <h3>Pillars</h3>
          <div id="missionPillarsEditor"></div>
        </div>

        <button class="btn btn-primary" id="missionSaveBtn">Save mission page</button>
        <div class="form-msg" id="missionFormMsg"></div>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
