<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — MANI Aerospace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="auth-shell">
    <div class="auth-card">
      <img src="assets/logo.png" alt="MANI Aerospace">
      <h1>Admin sign in</h1>
      <p class="sub">Sign in to edit news, the home page, and the mission page.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
        <div class="form-msg" id="loginMsg"></div>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Already signed in? skip straight to the dashboard.
    try {
      await apiGet('/auth/me');
      window.location.href = 'admin.html';
    } catch (err) { /* not signed in, stay on this page */ }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');
    msg.textContent = '';
    msg.className = 'form-msg';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      await apiSend('/auth/login', 'POST', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = 'admin.html';
    } catch (err) {
      msg.textContent = err.message || 'Sign in failed.';
      msg.className = 'form-msg error';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
