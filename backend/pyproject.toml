
[project]
name = "backend"
version = "0.1.0"
description = "MANI Aerospace REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "pydantic-settings>=2.16.2",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "src"
